<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Kojosropa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --clay: #c8102e;
      --clay-deep: #a80d24;
      --clay-light: #fef2f2;
      --white: #ffffff;
      --cream: #f5f5f5;
      --sand: #e5e5e5;
      --sand-deep: #d4d4d4;
      --espresso: #111111;
      --mocha: #525252;
      --taupe: #8a8a8a;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
      --font-display: 'Unbounded', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--espresso);
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ——— Brand ——— */
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      color: var(--espresso);
      letter-spacing: -0.04em;
    }

    .logo span { color: var(--clay); }

    .brand-sub {
      font-size: 14px;
      color: var(--taupe);
      margin-top: 6px;
    }

    /* ——— Card ——— */
    .card {
      width: 100%;
      background: var(--white);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 36px 32px;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      color: var(--espresso);
      text-align: center;
      margin-bottom: 4px;
    }

    .card-sub {
      font-size: 13px;
      color: var(--taupe);
      text-align: center;
      margin-bottom: 28px;
    }

    /* ——— Form ——— */
    .form-group {
      margin-bottom: 18px;
    }

    .label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--espresso);
      margin-bottom: 6px;
    }

    .label .required { color: var(--clay); margin-left: 2px; }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--taupe);
      pointer-events: none;
    }

    .input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 1.5px solid var(--sand);
      border-radius: var(--radius-md);
      background: var(--white);
      font-size: 14px;
      color: var(--espresso);
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input::placeholder { color: var(--taupe); }

    .input:focus {
      border-color: var(--clay);
      box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.1);
    }

    .input-error {
      border-color: var(--clay);
    }

    .error-msg {
      font-size: 12px;
      color: var(--clay);
      margin-top: 6px;
      display: none;
    }

    .error-msg.visible { display: block; }

    /* ——— Remember / Forgot ——— */
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--mocha);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--clay);
      border-radius: 4px;
      cursor: pointer;
    }

    .forgot-link {
      font-size: 13px;
      color: var(--clay);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }

    .forgot-link:hover { color: var(--clay-deep); }

    /* ——— Button ——— */
    .btn {
      width: 100%;
      padding: 13px 24px;
      background: var(--clay);
      color: var(--white);
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font-display);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.01em;
    }

    .btn:hover { background: var(--clay-deep); }
    .btn:active { transform: scale(0.98); }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-loading {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ——— Divider ——— */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--sand);
    }

    .divider span {
      font-size: 11px;
      color: var(--taupe);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 500;
    }

    /* ——— TOTP Step ——— */
    .totp-info {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 14px;
      background: var(--clay-light);
      border-radius: var(--radius-md);
      margin-bottom: 20px;
    }

    .totp-info svg { width: 18px; height: 18px; color: var(--clay); flex-shrink: 0; margin-top: 1px; }

    .totp-info p {
      font-size: 13px;
      color: var(--mocha);
      line-height: 1.5;
    }

    .totp-input {
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.3em;
      padding: 14px;
      font-family: var(--font-display);
    }

    /* ——— Error banner ——— */
    .error-banner {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      background: var(--clay-light);
      border-radius: var(--radius-md);
      margin-bottom: 18px;
    }

    .error-banner.visible { display: flex; }
    .error-banner svg { width: 16px; height: 16px; color: var(--clay); flex-shrink: 0; }
    .error-banner p { font-size: 13px; color: var(--clay); }

    /* ——— Back link ——— */
    .back-link {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--mocha);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      margin-bottom: 20px;
      padding: 0;
    }

    .back-link:hover { color: var(--espresso); }
    .back-link svg { width: 14px; height: 14px; }
    .back-link.visible { display: flex; }

    /* ——— Footer ——— */
    .footer-text {
      text-align: center;
      font-size: 12px;
      color: var(--taupe);
      margin-top: 24px;
    }

    .footer-text a {
      color: var(--mocha);
      text-decoration: none;
    }

    .footer-text a:hover { color: var(--clay); }

    /* ——— Mobile ——— */
    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { padding: 28px 24px; }
      .logo { font-size: 28px; }
    }

    @media (max-width: 360px) {
      body { padding: 12px; }
      .card { padding: 24px 20px; }
      .card-title { font-size: 18px; }
      .totp-input { font-size: 20px; letter-spacing: 0.2em; }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <!-- Brand -->
    <div class="brand">
      <div class="logo">Kojos<span>ropa</span></div>
      <p class="brand-sub">Admin access</p>
    </div>

    <!-- Card -->
    <div class="card">
      <!-- Step 1: Password -->
      <div id="stepPassword">
        <h2 class="card-title">Welcome back</h2>
        <p class="card-sub">Sign in to manage the rack</p>

        <div class="error-banner" id="pwError">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
          <p id="pwErrorMsg">Invalid password</p>
        </div>

        <form id="pwForm" onsubmit="return handlePassword(event)">
          <div class="form-group">
            <label class="label" for="password">Password <span class="required">*</span></label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
              <input class="input" id="password" name="password" type="password" required autocomplete="current-password" placeholder="Enter your password" autofocus>
            </div>
          </div>

          <div class="options-row">
            <label class="checkbox-label">
              <input type="checkbox" name="rememberMe" id="rememberMe">
              Remember me for 30 days
            </label>
            <a href="#" class="forgot-link">Forgot?</a>
          </div>

          <button type="submit" class="btn" id="pwSubmit">
            <span class="btn-text">Continue</span>
          </button>
        </form>
      </div>

      <!-- Step 2: TOTP -->
      <div id="stepTotp" style="display:none;">
        <button class="back-link visible" onclick="showPassword()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back
        </button>

        <h2 class="card-title">Two-factor auth</h2>
        <p class="card-sub">Enter the code from your authenticator app</p>

        <div class="totp-info">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <p>Open your authenticator app and enter the 6-digit verification code.</p>
        </div>

        <div class="error-banner" id="totpError">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
          <p id="totpErrorMsg">Invalid code</p>
        </div>

        <form id="totpForm" onsubmit="return handleTotp(event)">
          <div class="form-group">
            <label class="label" for="totp-code">Authenticator code <span class="required">*</span></label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              <input class="input totp-input" id="totp-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required>
            </div>
          </div>

          <button type="submit" class="btn" id="totpSubmit">
            <span class="btn-text">Verify & sign in</span>
          </button>
        </form>
      </div>
    </div>

    <p class="footer-text">
      <a href="prototype.html">← Back to shop</a>
    </p>
  </div>

  <script>
    function showPassword() {
      document.getElementById('stepPassword').style.display = '';
      document.getElementById('stepTotp').style.display = 'none';
    }

    function handlePassword(e) {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      if (pw.length === 0) return false;

      // Simulate loading
      const btn = document.getElementById('pwSubmit');
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-loading" style="display:flex"><span class="spinner"></span> Verifying…</span>';

      setTimeout(() => {
        // Demo: accept any password, show TOTP step
        document.getElementById('stepPassword').style.display = 'none';
        document.getElementById('stepTotp').style.display = '';
        document.getElementById('totp-code').focus();
        btn.disabled = false;
        btn.innerHTML = '<span class="btn-text">Continue</span>';
      }, 800);

      return false;
    }

    function handleTotp(e) {
      e.preventDefault();
      const code = document.getElementById('totp-code').value;
      if (code.length < 6) return false;

      const btn = document.getElementById('totpSubmit');
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-loading" style="display:flex"><span class="spinner"></span> Verifying…</span>';

      setTimeout(() => {
        // Demo: accept any 6-digit code
        btn.innerHTML = '<span class="btn-text">✓ Signed in</span>';
        btn.style.background = '#16a34a';
        setTimeout(() => {
          window.location.href = 'prototype.html';
        }, 600);
      }, 800);

      return false;
    }

    // Auto-advance TOTP input
    document.getElementById('totp-code')?.addEventListener('input', function() {
      this.value = this.value.replace(/\D/g, '').slice(0, 6);
    });
  </script>
</body>
</html>
